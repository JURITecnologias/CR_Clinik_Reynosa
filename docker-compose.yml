services:
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    ports:
      - "${CLINIK_HTTP_PORT:-8080}:80"
    environment:
      APP_NAME: CR Clinik
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${CLINIK_HTTP_PORT:-8080}/bkend/public
      APP_KEY: ${CLINIK_APP_KEY:-}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: crclinik
      DB_USERNAME: crclinik
      DB_PASSWORD: ${CLINIK_DB_PASSWORD:-clinik_local_only}
      CLINIK_API_HOST: /bkend/public/
      CLINIK_API_BASE_URL: http://127.0.0.1/bkend/public/api
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: crclinik
      MYSQL_USER: crclinik
      MYSQL_PASSWORD: ${CLINIK_DB_PASSWORD:-clinik_local_only}
      MYSQL_ROOT_PASSWORD: ${CLINIK_DB_ROOT_PASSWORD:-clinik_root_local_only}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  db_data:
