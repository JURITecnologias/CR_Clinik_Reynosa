<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/front
    RedirectMatch 302 ^/$ /login.php

    Alias /bkend/public /var/www/html/backend/api-consulmdregister/public

    <Directory /var/www/html/front>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html/backend/api-consulmdregister/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
